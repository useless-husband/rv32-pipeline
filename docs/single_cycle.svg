<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Core A: single-cycle datapath</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#24292f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <!-- core boundary -->
  <rect x="10" y="40" width="940" height="270" fill="none" stroke="#8c959f" stroke-dasharray="4 4"/>
  <text x="20" y="32" font-size="14" font-weight="bold" fill="#24292f">core_single: every instruction finishes in one clock cycle</text>

  <g fill="#f6f8fa" stroke="#24292f" stroke-width="1.2">
    <rect x="30" y="130" width="60" height="44" rx="4"/>
    <rect x="135" y="330" width="150" height="50" rx="4" fill="#fff8c5"/>
    <rect x="160" y="110" width="120" height="84" rx="4"/>
    <rect x="320" y="110" width="130" height="84" rx="4"/>
    <rect x="490" y="70" width="120" height="44" rx="4"/>
    <rect x="490" y="130" width="120" height="44" rx="4"/>
    <rect x="490" y="190" width="120" height="58" rx="4"/>
    <rect x="650" y="330" width="170" height="50" rx="4" fill="#fff8c5"/>
    <rect x="650" y="110" width="110" height="64" rx="4"/>
    <rect x="800" y="110" width="130" height="64" rx="4"/>
    <rect x="320" y="230" width="130" height="58" rx="4"/>
  </g>
  <g fill="#24292f">
    <text x="50" y="157">PC</text>
    <text x="145" y="352">instruction memory</text>
    <text x="145" y="369" font-size="12">combinational read</text>
    <text x="170" y="135">decoder</text>
    <text x="170" y="153" font-size="12">immediate,</text>
    <text x="170" y="168" font-size="12">control signals,</text>
    <text x="170" y="183" font-size="12">legality</text>
    <text x="330" y="135">register file</text>
    <text x="330" y="153" font-size="12">read rs1, rs2</text>
    <text x="330" y="168" font-size="12">write rd at the</text>
    <text x="330" y="183" font-size="12">clock edge</text>
    <text x="500" y="97">ALU</text>
    <text x="500" y="152">branch compare</text>
    <text x="500" y="212">multiply, divide</text>
    <text x="500" y="230" font-size="12">combinational</text>
    <text x="660" y="352">data memory</text>
    <text x="660" y="369" font-size="12">read now, write at the edge</text>
    <text x="660" y="135">load align</text>
    <text x="660" y="153" font-size="12">store align,</text>
    <text x="660" y="168" font-size="12">misaligned check</text>
    <text x="810" y="135">write-back mux</text>
    <text x="810" y="153" font-size="12">ALU / load / pc+4 /</text>
    <text x="810" y="168" font-size="12">CSR / mul-div</text>
    <text x="330" y="252">CSR file, traps</text>
    <text x="330" y="270" font-size="12">mtvec, mepc, counters</text>
  </g>

  <g stroke="#24292f" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M60 174 V355 H132"/>
    <path d="M210 330 V197"/>
    <path d="M280 152 H317"/>
    <path d="M450 130 H470 V92 H487"/>
    <path d="M450 152 H487"/>
    <path d="M450 172 H470 V219 H487"/>
    <path d="M610 92 H865 V107"/>
    <path d="M610 92 H630 V355 H647"/>
    <path d="M735 330 V177"/>
    <path d="M760 142 H797"/>
    <path d="M610 219 H780 V160 H797"/>
    <path d="M450 259 H790 V174"/>
    <path d="M865 174 V298 H385 V197"/>
  </g>
  <!-- next PC -->
  <g stroke="#cf222e" stroke-width="1.6" fill="none" stroke-dasharray="6 3" marker-end="url(#ar)">
    <path d="M550 70 V55 H60 V127"/>
    <path d="M330 288 V300 H22 V145 H27"/>
  </g>
  <text x="200" y="68" font-size="12" fill="#cf222e">next PC: pc+4, branch/JAL target, JALR target</text>
  <text x="40" y="296" font-size="12" fill="#cf222e">trap: mtvec, MRET: mepc</text>
  <text x="840" y="350" font-size="12" fill="#57606a">memories are</text>
  <text x="840" y="366" font-size="12" fill="#57606a">outside the core</text>
</svg>
