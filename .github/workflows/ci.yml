name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Everything comes from Ubuntu's own packages: verilator (5.020 on 24.04),
# iverilog (12), yosys (0.33).  The RISC-V programs are built with LLVM 23 from
# apt.llvm.org, the version the documented numbers were measured with: older
# clang releases generate different CoreMark code (Ubuntu's LLVM 18 emits ~1.7x
# as many jumps), which moves the predictor statistics test_perf.py bounds.
# The RTL keeps to a conservative SystemVerilog subset (no packages,
# interfaces, structs or casts to parameter widths) so these older versions
# accept it.  Third-party sources (riscv-tests, CoreMark) are fetched by the
# Makefile at pinned commits.

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator iverilog
          verilator --version
          iverilog -V 2>&1 | head -1
      - run: python -m pip install -r requirements-dev.txt
      - name: Verilator lint (-Wall)
        run: make lint
      - name: cocotb unit tests (Icarus)
        run: make unit PYTHON=python

  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Verilator and the RISC-V cross compiler (LLVM 23)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends verilator iverilog
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-23 lld-23
          echo "CLANG=clang-23" >> "$GITHUB_ENV"
          echo "LLD=ld.lld-23" >> "$GITHUB_ENV"
          verilator --version
          clang-23 --version | head -1
          ld.lld-23 --version
      - run: python -m pip install -r requirements-dev.txt
      - name: riscv-tests on the golden model
        run: make iss-test
      - name: riscv-tests, random programs and benchmarks on both cores, in lockstep
        run: make system PYTHON=python
      - name: Mutation check (every mutant must be caught)
        run: make mutants PYTHON=python
      - name: Benchmarks (cycle counts from the simulated cores)
        run: make bench
      - name: Pipeline viewer page
        run: make pipeview
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/bench.md
            build/mutants.md
            build/pipeview.html

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V
      - name: synth_xilinx for the XC7S50, both cores (fails if either does not fit)
        run: make synth
